name: Build & Deploy Pacman Repository

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/**'
  repository_dispatch:
    types:
      - package-updated
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Packages & Database
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git python uv sudo snappy \
            cmake ninja patchelf \
            qt6-base qt6-tools \
            curl jsoncpp sqlite openssl fmt spdlog libmediainfo openblas zlib gettext \
            shaderc spirv-headers vulkan-headers vulkan-icd-loader

      - name: Update package version on dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/update-pkgver.py --package "${{ github.event.client_payload.package }}" --commit "${{ github.event.client_payload.commit }}"
          if ! git diff --quiet packages/; then
            git add packages/
            git commit -m "chore(pkg): update ${{ github.event.client_payload.package }} pkgver [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run repository builder
        run: |
          ./scripts/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
